:root{--bg:#fff8f0;--card:#fff;--ink:#2b2433;--mute:#6f6679;--a:#ff6b4a;--b:#7c5cff;--line:#f0e3d6;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1824;--card:#27222f;--ink:#f6f0ff;--mute:#b3a9c0;--line:#3a3344}}
:root[data-theme="dark"]{--bg:#1c1824;--card:#27222f;--ink:#f6f0ff;--mute:#b3a9c0;--line:#3a3344}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:620px;margin:0 auto;padding:16px 18px 40px}
h1{font-size:24px;margin:8px 0 2px}h1 span{color:var(--a)}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.tab.on{background:var(--b);color:#fff;border-color:var(--b)}
.cv{background:var(--card);border:2px dashed #ffc83d;border-radius:24px;padding:10px}
svg{width:100%;height:auto;display:block}
.p{fill:none;stroke:var(--mute);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.p.now{stroke:var(--a);stroke-width:5}
.t{margin:14px 0 2px;font-size:20px;font-weight:800}
.d{margin:0 0 10px;color:var(--mute)}
.dots{display:flex;gap:6px;margin:10px 0}.dots span{height:8px;flex:1;border-radius:4px;background:var(--line)}.dots span.on{background:var(--a)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
button.b{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;background:var(--b);color:#fff}
button.b.main{background:var(--a)}button.b:disabled{opacity:.4}
.tip{margin-top:18px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:13px}
</style>
</head>
